<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Magical Aussie Dog Park — 2.5D Idle</title>
  <style>
    * {
      box-sizing: border-box;
      user-select: none;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background: radial-gradient(circle at center, #1b1734 0%, #0d0b1a 100%);
      color: #fff;
      overflow: hidden;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* Top HUD */
    #hud {
      position: absolute;
      top: 16px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 20px;
      background: rgba(28, 23, 52, 0.85);
      border: 2px solid #6c5ce7;
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.5), inset 0 0 12px rgba(108, 92, 231, 0.3);
      padding: 12px 28px;
      border-radius: 50px;
      z-index: 10;
      backdrop-filter: blur(6px);
    }

    .stat {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 1.1rem;
      font-weight: 700;
    }

    .stat span.label {
      color: #a29bfe;
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    /* Canvas Area */
    #gameCanvas {
      width: 100%;
      height: 100%;
      display: block;
      cursor: pointer;
    }

    /* Bottom Upgrade Dock */
    #controls {
      position: absolute;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 14px;
      z-index: 10;
      flex-wrap: wrap;
      justify-content: center;
      width: 95%;
      max-width: 820px;
    }

    .upgrade-btn {
      background: linear-gradient(180deg, #3c326e 0%, #261f47 100%);
      border: 2px solid #8c7ae6;
      color: #fff;
      padding: 12px 18px;
      border-radius: 16px;
      cursor: pointer;
      transition: transform 0.1s ease, border-color 0.2s, box-shadow 0.2s;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-width: 175px;
      box-shadow: 0 6px 15px rgba(0, 0, 0, 0.45);
    }

    .upgrade-btn:hover:not(:disabled) {
      transform: translateY(-3px);
      border-color: #ffeaa7;
      box-shadow: 0 8px 20px rgba(140, 122, 230, 0.45);
    }

    .upgrade-btn:active:not(:disabled) {
      transform: translateY(1px);
    }

    .upgrade-btn:disabled {
      opacity: 0.45;
      cursor: not-allowed;
      border-color: #4b446b;
    }

    .btn-title {
      font-weight: 700;
      font-size: 0.95rem;
      margin-bottom: 4px;
    }

    .btn-desc {
      font-size: 0.75rem;
      color: #dcdde1;
      margin-bottom: 6px;
    }

    .btn-cost {
      font-weight: 800;
      font-size: 0.85rem;
      color: #ffeaa7;
      background: rgba(0, 0, 0, 0.3);
      padding: 3px 10px;
      border-radius: 10px;
    }
  </style>
</head>
<body>

  <div id="hud">
    <div class="stat">🦴 <span id="boneCount">0</span> <span class="label">Bones</span></div>
    <div class="stat">✨ <span id="magicBoneCount">0</span> <span class="label">Magic Bones</span></div>
    <div class="stat">🐕 <span id="dogCount">1</span> <span class="label">Aussies</span></div>
    <div class="stat">⚡ <span id="bpsCount">0.0</span> <span class="label">/ sec</span></div>
  </div>

  <canvas id="gameCanvas"></canvas>

  <div id="controls">
    <button class="upgrade-btn" id="btnSummon">
      <div class="btn-title">🌀 Summon Aussie</div>
      <div class="btn-desc">Adds another pup to the park</div>
      <div class="btn-cost" id="costSummon">15 Bones</div>
    </button>

    <button class="upgrade-btn" id="btnDigPower">
      <div class="btn-title">⛏️ Dig Deeper</div>
      <div class="btn-desc">+1 Bone per dig</div>
      <div class="btn-cost" id="costDigPower">25 Bones</div>
    </button>

    <button class="upgrade-btn" id="btnZoomies">
      <div class="btn-title">🌟 Starlight Zoomies</div>
      <div class="btn-desc">Dogs move & dig 20% faster</div>
      <div class="btn-cost" id="costZoomies">40 Bones</div>
    </button>

    <button class="upgrade-btn" id="btnMushrooms">
      <div class="btn-title">🍄 Mystic Spores</div>
      <div class="btn-desc">+10% Magic Bone chance</div>
      <div class="btn-cost" id="costMushrooms">5 Magic Bones</div>
    </button>
  </div>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    // Game State
    const state = {
      bones: 0,
      magicBones: 0,
      digPower: 1,
      speedMultiplier: 1,
      magicChance: 0.12,
      costs: {
        summon: 15,
        digPower: 25,
        zoomies: 40,
        mushrooms: 5
      }
    };

    // Isometric Grid Settings (2.5D Diorama)
    const GRID_SIZE = 7;
    const TILE_W = 96;
    const TILE_H = 48;
    const TILE_DEPTH = 26;

    let originX = 0;
    let originY = 0;

    function resize() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
      originX = canvas.width / 2;
      originY = canvas.height / 2 - (GRID_SIZE * TILE_H) / 2 + 20;
    }
    window.addEventListener('resize', resize);
    resize();

    // Convert Isometric Grid (gx, gy) to Screen (sx, sy)
    function gridToScreen(gx, gy) {
      return {
        x: originX + (gx - gy) * (TILE_W / 2),
        y: originY + (gx + gy) * (TILE_H / 2)
      };
    }

    // Convert Screen (sx, sy) to Isometric Grid (gx, gy)
    function screenToGrid(sx, sy) {
      const dx = sx - originX;
      const dy = sy - originY;
      return {
        gx: (dx / (TILE_W / 2) + dy / (TILE_H / 2)) / 2,
        gy: (dy / (TILE_H / 2) - dx / (TILE_W / 2)) / 2
      };
    }

    // Environment Props
    const mushrooms = [
      { gx: 1.3, gy: 1.4, color: '#a29bfe', glow: 'rgba(162, 155, 254, 0.35)' },
      { gx: 5.5, gy: 1.8, color: '#fd79a8', glow: 'rgba(253, 121, 168, 0.35)' },
      { gx: 1.6, gy: 5.3, color: '#55efc4', glow: 'rgba(85, 239, 196, 0.35)' },
      { gx: 5.2, gy: 5.4, color: '#ffeaa7', glow: 'rgba(255, 234, 167, 0.35)' }
    ];

    // Entities
    const dogs = [];
    const droppedBones = [];
    const particles = [];

    class AustralianShepherd {
      constructor(gx, gy) {
        this.gx = gx;
        this.gy = gy;
        this.targetGx = gx;
        this.targetGy = gy;
        this.state = 'IDLE'; // IDLE, WALK, DIG
        this.timer = 0.5 + Math.random() * 1.5;
        this.facingRight = Math.random() > 0.5;
        this.animPhase = Math.random() * Math.PI * 2;
        this.isMagicDig = false;
      }

      pickNewTarget() {
        this.targetGx = 0.7 + Math.random() * (GRID_SIZE - 1.4);
        this.targetGy = 0.7 + Math.random() * (GRID_SIZE - 1.4);
        this.state = 'WALK';
      }

      update(dt) {
        const speed = 1.4 * state.speedMultiplier;
        this.animPhase += dt * (this.state === 'WALK' ? 12 * state.speedMultiplier : 5);

        if (this.state === 'IDLE') {
          this.timer -= dt * state.speedMultiplier;
          if (this.timer <= 0) {
            this.pickNewTarget();
          }
        } else if (this.state === 'WALK') {
          const dx = this.targetGx - this.gx;
          const dy = this.targetGy - this.gy;
          const dist = Math.hypot(dx, dy);

          // Determine screen facing direction
          const screenDeltaX = (dx - dy);
          if (Math.abs(screenDeltaX) > 0.01) {
            this.facingRight = screenDeltaX >= 0;
          }

          if (dist < 0.08) {
            this.gx = this.targetGx;
            this.gy = this.targetGy;
            this.state = 'DIG';
            this.timer = 1.1 / state.speedMultiplier;
            this.isMagicDig = Math.random() < state.magicChance;
          } else {
            this.gx += (dx / dist) * speed * dt;
            this.gy += (dy / dist) * speed * dt;
          }
        } else if (this.state === 'DIG') {
          this.timer -= dt;
          // Spawn dirt & magic particles while digging
          if (Math.random() < 0.35) {
            const pos = gridToScreen(this.gx, this.gy);
            particles.push({
              x: pos.x + (this.facingRight ? 12 : -12),
              y: pos.y + 4,
              vx: (Math.random() - 0.5) * 45,
              vy: -30 - Math.random() * 40,
              life: 0.5,
              maxLife: 0.5,
              color: this.isMagicDig ? '#ffeaa7' : '#795548',
              size: this.isMagicDig ? 3.5 : 3
            });
          }

          if (this.timer <= 0) {
            this.finishDig();
            this.state = 'IDLE';
            this.timer = 0.6 + Math.random() * 1.2;
          }
        }
      }

      finishDig() {
        const amount = state.digPower;
        const pos = gridToScreen(this.gx, this.gy);

        droppedBones.push({
          x: pos.x,
          y: pos.y - 6,
          vx: (Math.random() - 0.5) * 50,
          vy: -110,
          groundY: pos.y + 4,
          age: 0,
          isMagic: this.isMagicDig,
          value: this.isMagicDig ? 1 : amount
        });
      }

      draw(ctx) {
        const pos = gridToScreen(this.gx, this.gy);
        ctx.save();
        ctx.translate(pos.x, pos.y);

        // Magical Dig Aura
        if (this.state === 'DIG' && this.isMagicDig) {
          ctx.save();
          ctx.strokeStyle = 'rgba(255, 234, 167, 0.85)';
          ctx.lineWidth = 2.5;
          ctx.beginPath();
          ctx.ellipse(0, 6, 26 + Math.sin(this.animPhase * 2) * 3, 13, 0, 0, Math.PI * 2);
          ctx.stroke();
          ctx.restore();
        }

        // Ground Contact Shadow
        ctx.fillStyle = 'rgba(0, 0, 0, 0.3)';
        ctx.beginPath();
        ctx.ellipse(0, 6, 17, 8, 0, 0, Math.PI * 2);
        ctx.fill();

        if (!this.facingRight) {
          ctx.scale(-1, 1);
        }

        const bounce = this.state === 'WALK' ? Math.abs(Math.sin(this.animPhase)) * 3 : 0;
        const digTilt = this.state === 'DIG' ? 0.25 : 0;
        ctx.translate(0, -bounce);
        ctx.rotate(digTilt);

        // Animated Legs
        const legSwing = this.state === 'WALK' ? Math.sin(this.animPhase) * 4 : (this.state === 'DIG' ? Math.sin(this.animPhase * 3) * 5 : 0);
        ctx.fillStyle = '#c87d4b'; // Copper tan legs
        // Back leg
        ctx.fillRect(-11 - legSwing, -3, 4, 9);
        // Front leg
        ctx.fillRect(6 + legSwing, -3, 4, 9);

        // White Paws
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(-11 - legSwing, 4, 4, 3);
        ctx.fillRect(6 + legSwing, 4, 4, 3);

        // Fluffy Aussie Tail (Nub/Bobtail wag)
        const wag = Math.sin(this.animPhase * 1.5) * 2;
        ctx.fillStyle = '#4e433f';
        ctx.beginPath();
        ctx.arc(-15, -10 + wag, 4.5, 0, Math.PI * 2);
        ctx.fill();

        // Main Torso (Blue/Black Merle & Brown Coat)
        ctx.fillStyle = '#4e433f';
        ctx.beginPath();
        ctx.ellipse(-2, -9, 14, 9, 0, 0, Math.PI * 2);
        ctx.fill();

        // Saddle Patch
        ctx.fillStyle = '#736560';
        ctx.beginPath();
        ctx.ellipse(-3, -11, 9, 5, -0.1, 0, Math.PI * 2);
        ctx.fill();

        // Fluffy White Chest Ruff
        ctx.fillStyle = '#f8f9fa';
        ctx.beginPath();
        ctx.arc(9, -8, 7.5, 0, Math.PI * 2);
        ctx.fill();

        // Head
        ctx.fillStyle = '#4e433f';
        ctx.beginPath();
        ctx.arc(11, -17, 8, 0, Math.PI * 2);
        ctx.fill();

        // Copper Cheek / Eyebrow Tan Points
        ctx.fillStyle = '#d6894b';
        ctx.beginPath();
        ctx.arc(13, -15, 4, 0, Math.PI * 2);
        ctx.fill();

        // White Muzzle & Blaze
        ctx.fillStyle = '#ffffff';
        ctx.beginPath();
        ctx.ellipse(17, -15, 4.5, 3.2, 0, 0, Math.PI * 2);
        ctx.fill();

        // Nose
        ctx.fillStyle = '#1e1e1e';
        ctx.beginPath();
        ctx.arc(20.5, -16, 1.8, 0, Math.PI * 2);
        ctx.fill();

        // Eye
        ctx.fillStyle = '#1e272e';
        ctx.beginPath();
        ctx.arc(14, -18.5, 1.5, 0, Math.PI * 2);
        ctx.fill();

        // Floppy Aussie Ear
        ctx.fillStyle = '#382f2c';
        ctx.beginPath();
        ctx.ellipse(7, -19, 3.5, 5.5, 0.35, 0, Math.PI * 2);
        ctx.fill();

        ctx.restore();
      }
    }

    // Start with 1 Australian Shepherd
    dogs.push(new AustralianShepherd(3.5, 3.5));

    // Drawing Functions for 2.5D Environment
    function drawIsometricTile(gx, gy) {
      const top = gridToScreen(gx, gy);
      const right = gridToScreen(gx + 1, gy);
      const bottom = gridToScreen(gx + 1, gy + 1);
      const left = gridToScreen(gx, gy + 1);

      const isChecker = (gx + gy) % 2 === 0;

      // Top Grass Face
      ctx.beginPath();
      ctx.moveTo(top.x, top.y);
      ctx.lineTo(right.x, right.y);
      ctx.lineTo(bottom.x, bottom.y);
      ctx.lineTo(left.x, left.y);
      ctx.closePath();
      ctx.fillStyle = isChecker ? '#4cd137' : '#44bd32';
      ctx.fill();
      ctx.strokeStyle = 'rgba(255, 255, 255, 0.08)';
      ctx.lineWidth = 1;
      ctx.stroke();

      // Left Dirt Side (only on outer front-left edge)
      if (gy === GRID_SIZE - 1) {
        ctx.beginPath();
        ctx.moveTo(left.x, left.y);
        ctx.lineTo(bottom.x, bottom.y);
        ctx.lineTo(bottom.x, bottom.y + TILE_DEPTH);
        ctx.lineTo(left.x, left.y + TILE_DEPTH);
        ctx.closePath();
        ctx.fillStyle = '#795548';
        ctx.fill();
      }

      // Right Dirt Side (only on outer front-right edge)
      if (gx === GRID_SIZE - 1) {
        ctx.beginPath();
        ctx.moveTo(right.x, right.y);
        ctx.lineTo(bottom.x, bottom.y);
        ctx.lineTo(bottom.x, bottom.y + TILE_DEPTH);
        ctx.lineTo(right.x, right.y + TILE_DEPTH);
        ctx.closePath();
        ctx.fillStyle = '#5d4037';
        ctx.fill();
      }
    }

    function drawDoghouse() {
      const pos = gridToScreen(1.2, 1.2);
      ctx.save();
      ctx.translate(pos.x, pos.y);

      // Shadow
      ctx.fillStyle = 'rgba(0,0,0,0.3)';
      ctx.beginPath();
      ctx.ellipse(0, 6, 28, 14, 0, 0, Math.PI * 2);
      ctx.fill();

      // Wooden Walls
      ctx.fillStyle = '#8d5524';
      ctx.fillRect(-20, -24, 40, 26);

      // Portal Doorway
      ctx.fillStyle = '#2c2c54';
      ctx.beginPath();
      ctx.arc(0, -10, 10, Math.PI, 0);
      ctx.lineTo(10, 2);
      ctx.lineTo(-10, 2);
      ctx.closePath();
      ctx.fill();

      // Glowing Swirl Inside Portal
      ctx.strokeStyle = '#70a1ff';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(0, -8, 5 + Math.sin(Date.now() * 0.005) * 1.5, 0, Math.PI * 1.5);
      ctx.stroke();

      // Roof
      ctx.fillStyle = '#40739e';
      ctx.beginPath();
      ctx.moveTo(-26, -22);
      ctx.lineTo(0, -40);
      ctx.lineTo(26, -22);
      ctx.closePath();
      ctx.fill();

      ctx.restore();
    }

    function drawMushroomCluster(m) {
      const pos = gridToScreen(m.gx, m.gy);
      ctx.save();
      ctx.translate(pos.x, pos.y);

      // Ambient Glow
      const grad = ctx.createRadialGradient(0, -6, 2, 0, -6, 24);
      grad.addColorStop(0, m.glow);
      grad.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.arc(0, -6, 24, 0, Math.PI * 2);
      ctx.fill();

      // Stems & Caps
      const offsets = [
        { x: -7, y: 2, s: 0.75 },
        { x: 7, y: 3, s: 0.7 },
        { x: 0, y: 0, s: 1.0 }
      ];

      offsets.forEach(o => {
        ctx.save();
        ctx.translate(o.x, o.y);
        ctx.scale(o.s, o.s);

        ctx.fillStyle = '#f5f6fa';
        ctx.fillRect(-2.5, -10, 5, 10);

        ctx.fillStyle = m.color;
        ctx.beginPath();
        ctx.arc(0, -10, 8, Math.PI, 0);
        ctx.closePath();
        ctx.fill();

        ctx.restore();
      });

      ctx.restore();
    }

    function drawBoneSprite(x, y, isMagic) {
      ctx.save();
      ctx.translate(x, y);

      if (isMagic) {
        ctx.shadowColor = '#ffeaa7';
        ctx.shadowBlur = 12;
      }

      ctx.fillStyle = isMagic ? '#ffeaa7' : '#f5f6fa';
      ctx.strokeStyle = isMagic ? '#f39c12' : '#b2bec3';
      ctx.lineWidth = 1.5;

      // Shaft
      ctx.fillRect(-7, -2.5, 14, 5);
      // Knobs
      const knobs = [
        [-7, -3], [-7, 3],
        [7, -3], [7, 3]
      ];
      knobs.forEach(([kx, ky]) => {
        ctx.beginPath();
        ctx.arc(kx, ky, 3, 0, Math.PI * 2);
        ctx.fill();
      });

      ctx.restore();
    }

    // Click on Park to Manually Dig / Pet
    canvas.addEventListener('pointerdown', (e) => {
      const rect = canvas.getBoundingClientRect();
      const clickX = e.clientX - rect.left;
      const clickY = e.clientY - rect.top;
      const gridPos = screenToGrid(clickX, clickY);

      if (
        gridPos.gx >= 0 && gridPos.gx <= GRID_SIZE &&
        gridPos.gy >= 0 && gridPos.gy <= GRID_SIZE
      ) {
        const isMagic = Math.random() < state.magicChance;
        droppedBones.push({
          x: clickX,
          y: clickY - 10,
          vx: (Math.random() - 0.5) * 40,
          vy: -95,
          groundY: clickY + 5,
          age: 0,
          isMagic,
          value: isMagic ? 1 : state.digPower
        });
      }
    });

    // Upgrade Handlers
    document.getElementById('btnSummon').addEventListener('click', () => {
      if (state.bones >= state.costs.summon) {
        state.bones -= state.costs.summon;
        state.costs.summon = Math.floor(state.costs.summon * 1.45);
        dogs.push(new AustralianShepherd(1.5, 1.5));
        updateUI();
      }
    });

    document.getElementById('btnDigPower').addEventListener('click', () => {
      if (state.bones >= state.costs.digPower) {
        state.bones -= state.costs.digPower;
        state.digPower += 1;
        state.costs.digPower = Math.floor(state.costs.digPower * 1.55);
        updateUI();
      }
    });

    document.getElementById('btnZoomies').addEventListener('click', () => {
      if (state.bones >= state.costs.zoomies) {
        state.bones -= state.costs.zoomies;
        state.speedMultiplier *= 1.2;
        state.costs.zoomies = Math.floor(state.costs.zoomies * 1.65);
        updateUI();
      }
    });

    document.getElementById('btnMushrooms').addEventListener('click', () => {
      if (state.magicBones >= state.costs.mushrooms) {
        state.magicBones -= state.costs.mushrooms;
        state.magicChance = Math.min(0.85, state.magicChance + 0.1);
        state.costs.mushrooms = Math.floor(state.costs.mushrooms * 1.6);
        updateUI();
      }
    });

    function updateUI() {
      document.getElementById('boneCount').textContent = Math.floor(state.bones);
      document.getElementById('magicBoneCount').textContent = Math.floor(state.magicBones);
      document.getElementById('dogCount').textContent = dogs.length;

      // Estimated Bones Per Second
      const estBps = (dogs.length * state.digPower * state.speedMultiplier * 0.45).toFixed(1);
      document.getElementById('bpsCount').textContent = estBps;

      document.getElementById('costSummon').textContent = `${state.costs.summon} Bones`;
      document.getElementById('costDigPower').textContent = `${state.costs.digPower} Bones`;
      document.getElementById('costZoomies').textContent = `${state.costs.zoomies} Bones`;
      document.getElementById('costMushrooms').textContent = `${state.costs.mushrooms} Magic Bones`;

      document.getElementById('btnSummon').disabled = state.bones < state.costs.summon;
      document.getElementById('btnDigPower').disabled = state.bones < state.costs.digPower;
      document.getElementById('btnZoomies').disabled = state.bones < state.costs.zoomies;
      document.getElementById('btnMushrooms').disabled = state.magicBones < state.costs.mushrooms;
    }

    // Main Animation Loop
    let lastTime = performance.now();
    function loop(now) {
      const dt = Math.min(0.05, (now - lastTime) / 1000);
      lastTime = now;

      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // 1. Render 2.5D Isometric Park Tiles
      for (let gx = 0; gx < GRID_SIZE; gx++) {
        for (let gy = 0; gy < GRID_SIZE; gy++) {
          drawIsometricTile(gx, gy);
        }
      }

      // 2. Depth-sort Props & Australian Shepherds by Y position
      const renderables = [];
      renderables.push({ sortY: gridToScreen(1.2, 1.2).y, draw: drawDoghouse });

      mushrooms.forEach(m => {
        renderables.push({
          sortY: gridToScreen(m.gx, m.gy).y,
          draw: () => drawMushroomCluster(m)
        });
      });

      dogs.forEach(dog => {
        dog.update(dt);
        renderables.push({
          sortY: gridToScreen(dog.gx, dog.gy).y,
          draw: () => dog.draw(ctx)
        });
      });

      renderables.sort((a, b) => a.sortY - b.sortY);
      renderables.forEach(item => item.draw());

      // 3. Update & Draw Popped Bones (Auto-collect after bounce)
      for (let i = droppedBones.length - 1; i >= 0; i--) {
        const b = droppedBones[i];
        b.age += dt;

        if (b.age < 0.65) {
          b.x += b.vx * dt;
          b.y += b.vy * dt;
          b.vy += 320 * dt;
          if (b.y > b.groundY) {
            b.y = b.groundY;
            b.vy *= -0.4;
          }
        } else {
          // Fly up toward HUD counter
          const targetX = canvas.width / 2 - 120;
          const targetY = 36;
          b.x += (targetX - b.x) * 6 * dt;
          b.y += (targetY - b.y) * 6 * dt;

          if (Math.hypot(targetX - b.x, targetY - b.y) < 18) {
            if (b.isMagic) {
              state.magicBones += b.value;
            } else {
              state.bones += b.value;
            }
            droppedBones.splice(i, 1);
            updateUI();
            continue;
          }
        }

        drawBoneSprite(b.x, b.y, b.isMagic);
      }

      // 4. Particles
      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.life -= dt;
        p.x += p.vx * dt;
        p.y += p.vy * dt;
        p.vy += 120 * dt;

        if (p.life <= 0) {
          particles.splice(i, 1);
          continue;
        }

        ctx.globalAlpha = p.life / p.maxLife;
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
        ctx.fill();
        ctx.globalAlpha = 1;
      }

      requestAnimationFrame(loop);
    }

    updateUI();
    requestAnimationFrame(loop);
  </script>
</body>
</html>
