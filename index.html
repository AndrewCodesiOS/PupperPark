<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Magical Aussie Dog Park — 2.5D Idle</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <div id="hud">
    <div class="stat">🦴 <span id="boneCount">0</span> <span class="label">Bones</span></div>
    <div class="stat">✨ <span id="magicBoneCount">0</span> <span class="label">Magic Bones</span></div>
    <div class="stat">🐕 <span id="dogCount">1</span> <span class="label">Aussies</span></div>
    <div class="stat">⚡ <span id="bpsCount">0.0</span> <span class="label">/ sec</span></div>
    <button id="btnAudio" class="audio-btn" title="Toggle Audio">🔇 Sound: Off</button>
  </div>

  <canvas id="gameCanvas"></canvas>

  <div id="controls">
    <button class="upgrade-btn" id="btnSummon">
      <div class="btn-title">🌀 Summon Aussie</div>
      <div class="btn-desc">Adds another pup to the park</div>
      <div class="btn-cost" id="costSummon">15 Bones</div>
    </button>

    <button class="upgrade-btn" id="btnDigPower">
      <div class="btn-title">⛏️ Dig Deeper</div>
      <div class="btn-desc">+1 Bone per dig</div>
      <div class="btn-cost" id="costDigPower">25 Bones</div>
    </button>

    <button class="upgrade-btn" id="btnZoomies">
      <div class="btn-title">🌟 Starlight Zoomies</div>
      <div class="btn-desc">Dogs move & dig 20% faster</div>
      <div class="btn-cost" id="costZoomies">40 Bones</div>
    </button>

    <button class="upgrade-btn" id="btnMushrooms">
      <div class="btn-title">🍄 Mystic Spores</div>
      <div class="btn-desc">+10% Magic Bone chance</div>
      <div class="btn-cost" id="costMushrooms">5 Magic Bones</div>
    </button>
  </div>

  <!-- Offline Progress Modal -->
  <div id="offlineModal" class="modal" style="display: none;">
    <div class="modal-content">
      <h2>🐾 Welcome Back!</h2>
      <p>While you were away, your pack kept digging in the magical park.</p>
      <div id="offlineEarnings" class="offline-highlight">Earned 0 Bones!</div>
      <button id="btnCloseModal">Awesome!</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
